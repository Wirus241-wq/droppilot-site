    <style>

<body>
    <div class="content">
        <h1>DropPilot</h1>
        <p>DropPilot est un outil de gestion et de préparation des commandes destiné aux vendeurs en ligne.</p>
        <p>Il permet de centraliser les produits, préparer les annonces, suivre les commandes et estimer les coûts fournisseurs.</p>
        <p>Les achats fournisseurs nécessitent une validation humaine explicite.</p>
    </div>
